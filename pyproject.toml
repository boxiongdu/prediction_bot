[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-bot"
version = "0.1.0"
description = "Independent esports probability-modeling and value-trading research system for Kalshi"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "prediction_bot team"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "tenacity>=8.0",
    "structlog>=24.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.scripts]
prediction-bot = "prediction_bot.scripts.analyze:main"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", "__pycache__", ".venv", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["prediction_bot"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests that may call external APIs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_bot"]
